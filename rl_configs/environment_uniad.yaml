# Environment Configuration
# Controls environment wrapper, action/observation spaces, and reward parameters

action_space:
  # Physical action bounds (in meters)
  lateral_min: -0.6               # Minimum lateral displacement
  lateral_max: 0.6                # Maximum lateral displacement
  longitudinal_min: -0.5           # Minimum longitudinal displacement
  longitudinal_max: 5.0           # Maximum longitudinal displacement

observation_space:
  # BEV feature dimensions
  bev_h: 200                      # BEV feature map height
  bev_w: 200                      # BEV feature map width
  embed_dims: 256                 # Embedding dimension
  planning_steps: 6               # Number of planning waypoints

image_normalization:
  # Image preprocessing parameters
  mean: [103.530, 116.280, 123.675]  # BGR mean values
  std: [1.0, 1.0, 1.0]                # Standard deviation (no normalization)
  to_rgb: false                       # Keep BGR format

control:
  # Control parameters
  max_steer_rad: 0.698132         # Maximum steering angle (40 degrees in radians)
  wheelbase: 2.469                # Vehicle wheelbase in meters
  horizon: 3.0                    # Planning horizon in seconds
  control_dt: 0.1                 # Control timestep in seconds

reward:
  # Reward function weights (if used)
  progress_weight: 1.0            # Weight for route progress
  collision_penalty: -10.0        # Penalty for collision
  comfort_weight: 0.1             # Weight for comfort metrics
  ttc_weight: 0.5                 # Weight for time-to-collision

episode:
  # Episode termination conditions
  max_steps: 200                  # Maximum steps per episode
  min_rc_threshold: 0.01          # Minimum route completion to count episode

devices:
  # Device allocation
  uniad_device: "cuda"          # Device for UniAD backbone
  policy_device: "cuda"         # Device for policy network

