# Policy Network Configuration
# Controls actor-critic architecture, LoRA adapters, and learning rates

architecture:
  # Dimensions
  embed_dims: 256                 # Feature embedding dimension
  bev_h: 200                      # BEV feature map height
  bev_w: 200                      # BEV feature map width
  planning_steps: 6               # Number of trajectory waypoints

lora:
  # LoRA hyperparameters
  rank: 8                         # LoRA rank (bottleneck dimension)
  alpha: 8.0                      # LoRA scaling factor (alpha/rank)
  dropout: 0.0                    # LoRA dropout (0.0 for stability in RL)
  targets: ["q", "v"]             # Attention projections to adapt (q, v; NOT k)

learning_rates:
  # Base learning rates (overridden by phase presets)
  actor_lr: 0.000003              # Actor base learning rate
  critic_lr: 0.00001              # Critic learning rate

  # Actor sub-module LR ratios (relative to actor_lr)
  actor_lora_lr_ratio: 0.5        # LoRA LR = actor_lr * ratio
  actor_std_lr_ratio: 0.1         # log_std LR = actor_lr * ratio

  # Warmup steps (gradual LR increase for auxiliary modules)
  lora_warmup_updates: 10         # LoRA warmup updates
  std_warmup_updates: 15          # log_std warmup updates

exploration:
  # State-dependent exploration (SDE) parameters
  log_std_init: -3.0              # Initial log standard deviation
  log_std_bounds: [-5.0, -2.0]    # Bounds for clamping log_std (applied in gSDE mode)
  use_expln: true                 # Use exponential-linear activation for std
  full_std: true                  # Use full covariance matrix (latent_dim x action_dim)
  latent_sde_scale: 0.05          # Scaling factor for latent_sde (controls exploration strength)

regularization:
  # Regularization coefficients (overridden by phase presets)
  kl_reg_coef: 0.0                # KL divergence regularization
  bc_reg_coef: 0.0                # Behavioral cloning regularization
  weight_decay: 0.0               # Weight decay coefficient

optimizer:
  optimizer_class: "AdamW"        # Optimizer type
  weight_decay: 0.0001            # Weight decay for optimizer

