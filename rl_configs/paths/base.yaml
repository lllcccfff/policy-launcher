# Paths Configuration
# File paths and directory locations

# Output directories
output:
  base_dir: "rl_outputs"
  log_dir: "rl_outputs/logs"
  checkpoint_dir: "rl_outputs/checkpoints_critic_warmup"
  tensorboard_log: "rl_outputs/tensorboard"
  eval_results: "rl_outputs/eval_results.txt"

# Normalization statistics
normalization:
  vec_normalize_path: "checkpoints_critic_warmup/vec_normalize.pkl"

# Scene configuration
scene:
  config_dir_env_var: "SCENE_CONFIG_DIR"
  default_config_dir: "./configs/exps/sim/cirr_4_train"

